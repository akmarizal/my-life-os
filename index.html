<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Life OS</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#1f2a44">
<style>
:root{--bg:#faf7f2;--cd:#fff;--ink:#1f2a44;--sg:#7f9a84;--gd:#c9a24b;--ln:#e6e1d8;--mu:#6b7280}
[data-theme=dark]{--bg:#141a2b;--cd:#1d2540;--ink:#eee9df;--ln:#2d3658;--mu:#a0a8bd}
@media(prefers-color-scheme:dark){[data-theme=auto]{--bg:#141a2b;--cd:#1d2540;--ink:#eee9df;--ln:#2d3658;--mu:#a0a8bd}}
*{box-sizing:border-box}html,body{margin:0}body{font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2{font-family:Georgia,serif;font-weight:600;margin:.2em 0 .4em}h1{font-size:1.7rem}h2{font-size:1.15rem;margin-top:1.2em}
main{max-width:860px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 14px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin:10px 0}
details.card>summary{cursor:pointer;min-height:28px}details[open]>summary{margin-bottom:8px}
.m,small{color:var(--mu)}.g{flex:1;min-width:0}.row{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.dn .g b{text-decoration:line-through;opacity:.55}
label{display:block;font-size:.85rem;color:var(--mu);margin:8px 0}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:9px 10px;min-height:44px;margin-top:3px}
input[type=checkbox]{width:24px;height:24px;min-height:0;accent-color:var(--sg);margin:0;flex:none}input[type=range]{padding:0;accent-color:var(--sg)}
.b,button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--ln);background:var(--cd);color:var(--ink);min-height:44px;padding:0 14px}
.b{background:var(--ink);color:var(--bg);border-color:var(--ink);margin-top:8px}.x{min-height:36px;padding:0 9px;border:0;background:none;color:var(--mu)}
.tag{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:99px;background:var(--ln);margin-left:4px}.tag.High{background:var(--gd);color:#1f2a44}
.pb{height:7px;background:var(--ln);border-radius:9px;overflow:hidden;margin-top:6px}.pb i{display:block;height:100%;background:var(--sg)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid .card{margin:0}.big{font:600 1.6rem Georgia,serif}
.ch{display:flex;gap:4px;height:130px;align-items:stretch}.cc{flex:1;display:flex;flex-direction:column;align-items:center}.cb{flex:1;display:flex;align-items:flex-end;gap:2px;width:100%}.cb i{flex:1;border-radius:3px 3px 0 0;min-height:1px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal div{border-radius:8px;padding:6px 0;font-size:.8rem;border:1px solid var(--ln)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--ln);margin:0 2px}.dot.on{background:var(--sg)}
.q{border-left:3px solid var(--gd);padding-left:12px;font-family:Georgia,serif}
.vb{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.vb img{width:100%;border-radius:10px}
#bn,#sheet{position:fixed;left:0;right:0;background:var(--cd);border-top:1px solid var(--ln)}#bn{bottom:0;display:flex;padding-bottom:env(safe-area-inset-bottom)}
#bn button{flex:1;border:0;background:none;font-size:.7rem;padding:6px 0;display:flex;flex-direction:column;align-items:center;border-radius:0}
#sheet{display:none;bottom:calc(60px + env(safe-area-inset-bottom));grid-template-columns:repeat(3,1fr);gap:6px;padding:10px;border-radius:14px 14px 0 0}#sheet.open{display:grid}
#side{display:none}.nb.on{color:var(--gd);font-weight:600}
@media(min-width:900px){body{padding:0 0 0 230px}#bn,#sheet{display:none!important}#side{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:230px;padding:20px 12px;background:var(--cd);border-right:1px solid var(--ln);gap:2px}#side button{text-align:left;border:0;background:none}#side button.on{background:var(--bg)}.grid{grid-template-columns:repeat(4,1fr)}}
</style></head><body>
<aside id="side"></aside><main id="main"></main><div id="sheet"></div><nav id="bn"></nav>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ds=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),td=()=>ds(new Date()),addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return ds(d)};
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0,sum=a=>a.reduce((x,y)=>x+(+y||0),0),rm=n=>'RM '+(+n||0).toLocaleString('en-MY',{maximumFractionDigits:2});
const CATS=['Career & Professional Development','Education & Knowledge','Financial Freedom & Wealth','Health & Fitness','Mental Growth & Intelligence','Personal Development & Character','Family, Relationships & Marriage','Spiritual Growth','Business & Entrepreneurship','Lifestyle & Experiences'];
const HZ=['Short-term','1 year','3 years','5 years','10 years'],PRI=['High','Medium','Low'],ST=['Not Started','In Progress','Completed'],PER=['Morning','Afternoon','Evening','Night'];
const NAV=[['today','🏠','Dashboard'],['plan','📅','Daily Planner'],['goals','🎯','Life Goals'],['career','💼','Career & Education'],['fin','💰','Financial Tracker'],['health','💪','Health & Fitness'],['habits','✅','Habit Tracker'],['learn','📚','Learning Hub'],['journal','📓','Journal'],['rev','📈','Reviews & Analytics'],['purpose','🧭','Life Purpose'],['set','⚙️','Settings']];
const Q=['Small steps, repeated, become a different life.','Direction matters more than speed.','A missed day is data, not a verdict. Start again today.','Do the next right thing.','Consistency is quiet, and it compounds.','You are building someone you will be proud to meet.'];
const HB=['Wake up early','Make my bed','Exercise','Read books','Learn something new','Improve English communication','Learn pharmaceutical / regulatory knowledge','Reduce unnecessary phone usage','Maintain personal hygiene','Sleep on time','Review daily goals'];
const CS=[['GMP, GDP, GDocP and ISO knowledge','Skill'],['NPRA requirements and pharmaceutical regulations','Skill'],['QA experience: CAPA, deviations, audits, documentation','Skill'],['Master\'s in Pharmaceutical Legislation & Regulatory Control (UM, part-time)','Education'],['Regulatory Affairs / Quality / Compliance Specialist','Milestone']];
const D=()=>({profile:{name:'',budget:0,rday:0},focus:{},purpose:{},tasks:[],sched:[],goals:[],career:CS.map(([title,type])=>({id:uid(),title,type,status:'Not Started',pct:0,date:'',notes:''})),learn:[],fin:[],fgoals:[],debts:[],habits:HB.map(name=>({id:uid(),name})),hlog:{},health:{},journal:{},reviews:{},vision:[],quotes:[],ltoday:{},lastBackup:''});
let S,db,ui={p:'today',hz:HZ[0]},tm;
const open=()=>new Promise((r,j)=>{const q=indexedDB.open('lifeos',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=j});
const load=()=>new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r()});
const save=()=>{clearTimeout(tm);tm=setTimeout(()=>{try{db.transaction('kv','readwrite').objectStore('kv').put(JSON.parse(JSON.stringify(S)),'s')}catch(e){}},250)};
const setP=(p,v)=>{const a=p.split('.');let o=S;a.slice(0,-1).forEach(k=>o=o[k]??(o[k]={}));o[a.pop()]=v};
const getP=p=>p.split('.').reduce((o,k)=>o?.[k],S)??'';
const MAP={num:'number',date:'date',dnow:'date',time:'time'};
const fld=(k,x,f)=>{const[n,l,ty,o,df]=f,v=x?x[n]??'':df??(ty=='dnow'?td():''),a=x?`data-k=${k} data-i=${x.id} data-f=${n}`:`data-n=${n}`;
const i=ty=='area'?`<textarea rows=2 ${a}>${esc(v)}</textarea>`:ty=='sel'?`<select ${a} ${x?'data-r':''}>${o.map(c=>`<option ${c==v?'selected':''}>${esc(c)}</option>`).join('')}</select>`:ty=='range'?`<input type=range min=0 max=100 value="${v||0}" ${a} ${x?'data-r':''}>`:`<input type=${MAP[ty]||'text'} step=any value="${esc(v)}" ${a}>`;return`<label>${l}${i}</label>`};
const af=(k,F,t='+ Add',op='')=>`<details class=card ${op}><summary><b>${t}</b></summary><div data-add=${k}>${F.map(f=>fld(k,0,f)).join('')}<button class=b data-act=add>Add</button></div></details>`;
const pb=p=>`<div class=pb><i style="width:${Math.min(100,Math.max(0,p))}%"></i></div>`;
const item=(k,x,F,p)=>{p=p??x.pct;return`<details class=card><summary><b>${esc(x[F[0][0]]||'Untitled')}</b>${F.filter(f=>f[2]=='sel').slice(0,2).map(f=>`<span class=tag>${esc(x[f[0]])}</span>`).join('')}${p!=null?pb(p):''}</summary>${F.map(f=>fld(k,x,f)).join('')}<button class=b data-act=del data-k=${k} data-i=${x.id}>Delete</button></details>`};
const bars=(L,Sx,fmt=v=>v)=>{const mx=Math.max(1,...Sx.flatMap(s=>s.v));return`<div class=ch>${L.map((l,i)=>`<div class=cc><div class=cb>${Sx.map(s=>`<i style="height:${(s.v[i]||0)/mx*100}%;background:${s.c}" title="${fmt(s.v[i]||0)}"></i>`).join('')}</div><small>${l}</small></div>`).join('')}</div>`};
const ta=(p,l,r=2)=>`<label>${l}<textarea rows=${r} data-o="${p}">${esc(getP(p))}</textarea></label>`;
const days=n=>[...Array(n)].map((_,i)=>addD(td(),i-n+1)),wd=x=>'SMTWTFS'[new Date(x+'T12:00').getDay()];
const hpct=d=>S.habits.length?(S.hlog[d]||[]).filter(i=>S.habits.some(h=>h.id==i)).length/S.habits.length*100:0;
const streak=id=>{let n=0,d=td();if(!(S.hlog[d]||[]).includes(id))d=addD(d,-1);while((S.hlog[d]||[]).includes(id)){n++;d=addD(d,-1)}return n};
const srt=(a,b)=>PRI.indexOf(a.pri)-PRI.indexOf(b.pri)||(a.time||'99').localeCompare(b.time||'99'),tk=d=>S.tasks.filter(x=>x.date==d||(!x.done&&x.date<d));
const TF=[['title','Task','text'],['cat','Category','sel',['Work','Career','Health','Finance','Personal','Learning','Reminder']],['pri','Priority','sel',PRI,'Medium'],['time','Due time','time'],['desc','Description','text'],['status','Status','sel',ST]];
const trow=x=>`<div class="row${x.done?' dn':''}"><input type=checkbox data-act=tgl data-i=${x.id} ${x.done?'checked':''}><div class=g><b>${esc(x.title)}</b><br><small>${x.time||''} ${esc(x.cat)}${x.desc?' · '+esc(x.desc):''}</small></div><span class="tag ${x.pri}">${x.pri}</span><button class=x data-act=del data-k=tasks data-i=${x.id}>✕</button></div>`;
const GF=[['title','Goal','text'],['cat','Category','sel',CATS],['hz','Time horizon','sel',HZ],['pri','Priority','sel',PRI],['date','Target date','date'],['why','Why this matters','area'],['desc','Description','area'],['ms','Milestones (one per line)','area'],['steps','Action steps','area'],['status','Status','sel',['Not Started','In Progress','On Hold','Achieved']],['pct','Progress','range']];
const CF=[['title','Item','text'],['type','Type','sel',['Skill','Certification','Training / Seminar','Milestone','Education','Monthly goal']],['status','Status','sel',['Not Started','In Progress','Completed']],['date','Target date','date'],['pct','Progress','range'],['notes','Notes','area']];
const LF=[['topic','Topic','text'],['cat','Category','sel',['Biomedical Science','Pharmaceutical Science','Regulatory Affairs','GMP / GDP / ISO','Supply Chain Management','Technology & AI','Finance & Investment','General Knowledge','English Communication','Personal Development']],['status','Status','sel',['To learn','Learning','Done']],['date','Target date','date'],['link','Useful link','text'],['notes','Notes','area'],['take','Key takeaways','area']];
const FF=[['note','Description','text'],['type','Type','sel',['Expense','Income','Savings']],['cat','Category','sel',['Salary','Food','Transport','Housing','Loan / Vehicle','Bills','Family & Marriage','Investment','Emergency fund','Other']],['amt','Amount (RM)','num'],['date','Date','dnow']];
const GFF=[['title','Financial goal','text'],['type','Type','sel',['Emergency fund','Investment','Marriage & family','Vehicle','Property','Business capital','Other']],['target','Target (RM)','num'],['saved','Saved so far (RM)','num']];
const DF=[['title','Debt / loan','text'],['bal','Balance (RM)','num'],['pay','Monthly payment (RM)','num']];
const V={};
V.today=()=>{const d=td(),T=tk(d),dn=T.filter(x=>x.done).length,tp=T.length?Math.round(dn/T.length*100):0,hp=Math.round(hpct(d)),sc=T.length?Math.round((tp+hp)/2):hp,h=new Date().getHours(),op=T.filter(x=>!x.done).sort(srt),qs=Q.concat(S.quotes.map(q=>q.text)),q=qs[Math.floor(Date.now()/864e5)%qs.length];
const gl=S.goals.filter(g=>g.status!='Achieved').sort((a,b)=>PRI.indexOf(a.pri)-PRI.indexOf(b.pri)).slice(0,3);
return`<h1>${h<12?'Good morning':h<18?'Good afternoon':'Good evening'}${S.profile.name?', '+esc(S.profile.name):''}</h1><p class=m>${new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
${new Date().getDay()==S.profile.rday?`<div class=card>Today is your review day. <button data-act=nav data-p=rev>Open review</button></div>`:''}
<div class=card><label>Today's main focus<input data-o="focus.${d}" value="${esc(getP('focus.'+d))}" placeholder="What matters most today?"></label>${pb(sc)}</div>
<div class=grid><div class=card><div class=big>${dn}/${T.length}</div><small>tasks done</small></div><div class=card><div class=big>${hp}%</div><small>habits done</small></div><div class=card><div class=big>${sc}%</div><small>daily score</small></div><div class=card><div class=big>${op.length}</div><small>tasks remaining</small></div></div>
<p class=q>${esc(q)}</p>
<h2>Top 3 priorities</h2><div class=card>${op.slice(0,3).map(trow).join('')||'<small>Nothing pending. Add a task below.</small>'}</div>
${af('tasks',[TF[0],TF[2]],'+ Quick add task','open')}
${op.length>3?`<h2>Other tasks</h2><div class=card>${op.slice(3).map(trow).join('')}</div>`:''}
${op.some(x=>x.cat=='Reminder')?`<h2>Reminders</h2><div class=card>${op.filter(x=>x.cat=='Reminder').map(x=>`<div class=row>🔔 ${esc(x.title)}</div>`).join('')}</div>`:''}
<h2>Remember why you started</h2><div class=card>${S.purpose.why?`<p>${esc(S.purpose.why)}</p>`:'<small>Write your reasons in Life Purpose.</small>'}${gl.map(g=>`<div class=row><div class=g>${esc(g.title)}${pb(g.pct)}</div></div>`).join('')}</div>
${S.lastBackup&&(Date.now()-new Date(S.lastBackup))<12096e5||!S.tasks.length&&!S.goals.length?'':'<div class=card><small>It has been a while since your last backup. Settings > Export all data.</small></div>'}`};
V.plan=()=>{const d=td(),T=tk(d).sort(srt);return`<h1>Daily Planner</h1>${af('tasks',TF,'+ New task','open')}<div class=card>${T.map(x=>trow(x)+`<select data-k=tasks data-i=${x.id} data-f=status data-r>${ST.map(s=>`<option ${s==x.status?'selected':''}>${s}</option>`).join('')}</select>`).join('')||'<small>No tasks yet.</small>'}</div>
<h2>Schedule</h2>${af('sched',[['text','Activity','text'],['per','Period','sel',PER],['time','Time','time']],'+ Add time slot')}${PER.map(p=>{const L=S.sched.filter(x=>x.date==d&&x.per==p).sort((a,b)=>(a.time||'').localeCompare(b.time||''));return`<div class=card><b>${p}</b>${L.map(x=>`<div class=row><input style="width:110px" type=time data-k=sched data-i=${x.id} data-f=time value="${x.time||''}"><input data-k=sched data-i=${x.id} data-f=text value="${esc(x.text)}"><button class=x data-act=del data-k=sched data-i=${x.id}>✕</button></div>`).join('')||'<br><small>Free</small>'}</div>`}).join('')}`};
V.goals=()=>{const L=S.goals.filter(g=>g.hz==ui.hz);const GF2=GF.map(f=>f[0]=='hz'?[...f.slice(0,4),ui.hz]:f);return`<h1>Life Goals</h1><div class=grid style="grid-template-columns:repeat(3,1fr)">${HZ.map(h=>`<button class="${h==ui.hz?'b':''}" data-act=tab data-v="${h}">${h}</button>`).join('')}</div><p class=m>${L.length} goals · average progress ${avg(L.map(g=>g.pct||0))}%</p>${af('goals',GF2,'+ Add goal')}${L.map(g=>item('goals',g,GF)).join('')||'<p class=m>No goals in this view yet.</p>'}`};
V.career=()=>`<h1>Career & Education</h1><p class=m>Roadmap, skills, certifications, training and further study. Everything here is editable.</p>${af('career',CF)}${['Skill','Certification','Training / Seminar','Education','Milestone','Monthly goal'].map(t=>{const L=S.career.filter(x=>x.type==t);return L.length?`<h2>${t}</h2>${L.map(x=>item('career',x,CF)).join('')}`:''}).join('')}`;
V.fin=()=>{const m=td().slice(0,7),I=S.fin.filter(x=>x.date.startsWith(m)),t=y=>sum(I.filter(x=>x.type==y).map(x=>x.amt)),inc=t('Income'),ex=t('Expense'),sv=t('Savings'),ms=[...Array(6)].map((_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+i-5);return ds(d).slice(0,7)}),bu=+S.profile.budget||0;
const mt=(k,y)=>sum(S.fin.filter(x=>x.date.startsWith(k)&&x.type==y).map(x=>x.amt));
return`<h1>Financial Tracker</h1><div class=grid><div class=card><div class=big>${rm(inc)}</div><small>income this month</small></div><div class=card><div class=big>${rm(ex)}</div><small>expenses</small></div><div class=card><div class=big>${rm(sv)}</div><small>saved</small></div><div class=card><div class=big>${rm(inc-ex)}</div><small>left over</small></div></div>
${bu?`<div class=card><small>Budget ${rm(bu)}: ${Math.round(ex/bu*100)}% used</small>${pb(ex/bu*100)}</div>`:''}
<div class=card><b>Last 6 months</b> <small>(sage: income, gold: expenses)</small>${bars(ms.map(k=>k.slice(5)),[{c:'var(--sg)',v:ms.map(k=>mt(k,'Income'))},{c:'var(--gd)',v:ms.map(k=>mt(k,'Expense'))}],rm)}</div>
${af('fin',FF,'+ Add transaction','open')}<div class=card>${S.fin.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,25).map(x=>`<div class=row><div class=g>${esc(x.note||x.cat)}<br><small>${x.date} · ${esc(x.cat)}</small></div><b>${x.type=='Expense'?'-':'+'}${rm(x.amt)}</b><button class=x data-act=del data-k=fin data-i=${x.id}>✕</button></div>`).join('')||'<small>No transactions yet.</small>'}</div>
<h2>Savings, investments & financial goals</h2>${af('fgoals',GFF)}${S.fgoals.map(x=>item('fgoals',x,GFF,x.target?x.saved/x.target*100:0)).join('')}
<h2>Debts & loans</h2>${af('debts',DF)}${S.debts.map(x=>item('debts',x,DF,null)).join('')}<p class=m>Personal tracking only, not financial advice. Total debt: ${rm(sum(S.debts.map(x=>x.bal)))}</p>`};
V.health=()=>{const d=td(),H=S.health[d]||{},L=days(7),g=f=>L.map(x=>+(S.health[x]||{})[f]||0),n=(f,l,p)=>`<label>${l}<input type=number step=any data-o="health.${d}.${f}" value="${esc(H[f])}" placeholder="${p||''}"></label>`,ck=(f,l)=>`<label style="display:flex;gap:10px;align-items:center"><input type=checkbox data-o="health.${d}.${f}" ${H[f]?'checked':''}>${l}</label>`;
return`<h1>Health & Fitness</h1><div class=card><b>Today</b>${n('water','Water (glasses)')}${n('sleep','Sleep (hours)')}${n('steps','Steps')}${n('weight','Weight (kg)')}${n('waist','Waist (cm)')}<label>Workout<input data-o="health.${d}.workout" value="${esc(H.workout)}" placeholder="e.g. Gym, 40 min"></label>${ck('eat','Ate healthily today')}${ck('skin','Skincare and grooming done')}</div>
${[['steps','Steps','var(--sg)'],['water','Water','var(--gd)'],['sleep','Sleep (h)','var(--ink)'],['weight','Weight (kg)','var(--sg)']].map(([f,l,c])=>`<div class=card><b>${l}, last 7 days</b>${bars(L.map(wd),[{c,v:g(f)}])}</div>`).join('')}`};
V.habits=()=>{const d=td(),L=days(7),L30=days(30),n=new Date(),dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),off=new Date(n.getFullYear(),n.getMonth(),1).getDay();
return`<h1>Habit Tracker</h1><p class=m>Consistency beats perfection. A missed day is not a reset.</p><div class=card>${S.habits.map(h=>`<div class=row><input type=checkbox data-act=hab data-i=${h.id} ${(S.hlog[d]||[]).includes(h.id)?'checked':''}><div class=g>${esc(h.name)}<br><small>${streak(h.id)} day streak · ${Math.round(L30.filter(x=>(S.hlog[x]||[]).includes(h.id)).length/30*100)}% in 30 days</small></div><span>${L.map(x=>`<i class="dot ${(S.hlog[x]||[]).includes(h.id)?'on':''}"></i>`).join('')}</span><button class=x data-act=del data-k=habits data-i=${h.id}>✕</button></div>`).join('')}</div>${af('habits',[['name','New habit','text']])}
<h2>This month</h2><div class=card><div class=cal>${[...'SMTWTFS'].map(x=>`<small>${x}</small>`).join('')}${'<span></span>'.repeat(off)}${[...Array(dim)].map((_,i)=>{const k=ds(new Date(n.getFullYear(),n.getMonth(),i+1));return`<div style="background:rgba(127,154,132,${hpct(k)/100})">${i+1}</div>`}).join('')}</div></div>
<div class=card><b>Consistency, last 14 days</b>${bars(days(14).map(x=>x.slice(8)),[{c:'var(--sg)',v:days(14).map(hpct)}],v=>Math.round(v)+'%')}</div>`};
V.learn=()=>{const d=td(),P=S.learn.filter(x=>x.status!='Done'),s=P.length?P[Math.floor(Date.now()/864e5)%P.length]:null;
return`<h1>Learning Hub</h1><div class=card><b>Learn something new today</b>${s?`<p>Suggested: <b>${esc(s.topic)}</b> <small>(${esc(s.cat)})</small></p>`:'<p class=m>Add topics below and one will be suggested daily.</p>'}<label>What did I learn today?<textarea rows=2 data-o="ltoday.${d}">${esc(getP('ltoday.'+d))}</textarea></label></div>
<p class=m>${S.learn.filter(x=>x.status=='Done').length} of ${S.learn.length} topics completed</p>${af('learn',LF,'+ Add learning topic')}${S.learn.map(x=>item('learn',x,LF,x.status=='Done'?100:x.status=='Learning'?50:0)).join('')}`};
V.journal=()=>{const d=ui.jd||td(),J=S.journal[d]||{},t=([f,l])=>`<label>${l}<textarea rows=2 data-o="journal.${d}.${f}">${esc(J[f])}</textarea></label>`;
return`<h1>Journal</h1><label>Date<input type=date data-ui=jd value="${d}"></label><div class=card><b>Morning</b>${[['m1','What are my 3 main priorities today?'],['m2','What do I want to accomplish?'],['m3','What should I avoid today?']].map(t).join('')}</div><div class=card><b>Night</b>${[['n1','What did I accomplish today?'],['n2','What did I learn?'],['n3','What could I improve?'],['n4','What am I grateful for?'],['n5','Did I move closer to my life goals?']].map(t).join('')}</div>
<h2>Past entries</h2><div class=card>${Object.keys(S.journal).sort().reverse().map(k=>`<div class=row><button data-act=jd data-v=${k}>${k}</button><small class=g>${esc(Object.values(S.journal[k]).join(' ').slice(0,70))}</small></div>`).join('')||'<small>No entries yet.</small>'}</div>`};
V.rev=()=>{const L=days(7),d=td(),m=d.slice(0,7),wk=L[0],T7=S.tasks.filter(x=>L.includes(x.date)),md=days(+d.slice(8)),sc=avg([avg(md.map(hpct)),T7.length?Math.round(T7.filter(x=>x.done).length/T7.length*100):avg(md.map(hpct))]),H=f=>avg(L.map(x=>+(S.health[x]||{})[f]||0).filter(Boolean)),fin=t=>sum(S.fin.filter(x=>x.date.startsWith(m)&&x.type==t).map(x=>x.amt)),op=S.goals.filter(g=>g.status!='Achieved');
return`<h1>Reviews & Analytics</h1><h2>Weekly review</h2><div class=card><p>Tasks completed: <b>${T7.filter(x=>x.done).length}/${T7.length}</b><br>Habit consistency: <b>${avg(L.map(hpct))}%</b><br>Career items in progress: <b>${S.career.filter(x=>x.status=='In Progress').length}</b><br>Avg sleep: <b>${H('sleep')||'-'} h</b> · avg steps: <b>${H('steps')||'-'}</b><br>Saved this month: <b>${rm(fin('Savings'))}</b></p>${[['ach','Biggest achievement'],['chal','Biggest challenge'],['less','Lessons learned'],['next','Priorities for next week']].map(([f,l])=>ta(`reviews.w${wk}.${f}`,l)).join('')}</div>
<h2>Monthly review</h2><div class=card><div class=big>${sc}%</div><small>overall score this month</small>${pb(sc)}<p>Goal progress: <b>${avg(op.map(g=>g.pct||0))}%</b> across ${op.length} active goals<br>Income ${rm(fin('Income'))} · expenses ${rm(fin('Expense'))}<br>Topics done: <b>${S.learn.filter(x=>x.status=='Done').length}</b></p>${[['well','What went well?'],['imp','What needs improvement?'],['grow','Personal growth'],['focus','Next month\'s focus']].map(([f,l])=>ta(`reviews.m${m}.${f}`,l)).join('')}</div>
<div class=card><b>Habit consistency, last 14 days</b>${bars(days(14).map(x=>x.slice(8)),[{c:'var(--sg)',v:days(14).map(hpct)}],v=>Math.round(v)+'%')}</div>`};
V.purpose=()=>`<h1>Life Purpose</h1>${[['become','Who I want to become'],['life','The life I want to build'],['values','My personal values'],['success','My definition of success'],['vision','My long-term vision'],['why','My reasons for working hard'],['a30','What I want to achieve before 30'],['a35','What I want to achieve before 35'],['a40','What I want to achieve before 40']].map(([f,l])=>ta('purpose.'+f,l,3)).join('')}<h2>My future self</h2>${ta('purpose.future','Describe the person you want to become',5)}
<h2>Vision board</h2><label>Add a picture<input type=file accept="image/*" id=vf></label><div class=vb>${S.vision.map(v=>`<div class=card><img src="${v.img}" alt=""><input data-k=vision data-i=${v.id} data-f=note value="${esc(v.note)}" placeholder="Note"><button class=x data-act=del data-k=vision data-i=${v.id}>Remove</button></div>`).join('')}</div>
<h2>My motivational statements</h2>${af('quotes',[['text','Statement','text']])}<div class=card>${S.quotes.map(q=>`<div class=row><div class=g>${esc(q.text)}</div><button class=x data-act=del data-k=quotes data-i=${q.id}>✕</button></div>`).join('')||'<small>They will appear on your dashboard.</small>'}</div>`;
V.set=()=>`<h1>Settings</h1><div class=card><label>Your name<input data-o=profile.name value="${esc(S.profile.name)}"></label><label>Monthly budget (RM)<input type=number data-o=profile.budget value="${S.profile.budget||''}"></label><label>Weekly review day<select data-o=profile.rday>${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((x,i)=>`<option value=${i} ${i==S.profile.rday?'selected':''}>${x}</option>`).join('')}</select></label><label>Theme<select data-ui=theme>${['auto','light','dark'].map(x=>`<option ${x==(localStorage.theme||'auto')?'selected':''}>${x}</option>`).join('')}</select></label></div>
<h2>Backup & restore</h2><div class=card><p class=m>Your data lives only on this device. Last backup: ${S.lastBackup?S.lastBackup.slice(0,10):'never'}. To move data between phone and laptop: export here, send the file to yourself, import on the other device.</p><button class=b data-act=exp>Export all data (JSON)</button> <button class=b data-act=csv data-v=tasks>Tasks (CSV)</button> <button class=b data-act=csv data-v=fin>Finance (CSV)</button><label>Import backup (replaces current data)<input type=file accept=".json" id=imp></label></div>
<h2>Reset a section</h2><div class=card><select id=rs>${['tasks','sched','goals','career','learn','fin','fgoals','debts','habits','hlog','health','journal','reviews','vision','quotes','purpose'].map(x=>`<option>${x}</option>`).join('')}</select><button class=b data-act=rst>Reset selected</button></div>
<h2>Install as an app</h2><div class=card><small>iPhone: Safari > Share > Add to Home Screen. Android: Chrome menu > Install app. Laptop: install icon in the address bar. Works offline after the first load.</small></div>`;
const render=()=>{$('#main').innerHTML=V[ui.p]();$$('.nb').forEach(b=>b.classList.toggle('on',b.dataset.p==ui.p));$('#sheet').classList.remove('open')};
const nb=n=>`<button class=nb data-act=nav data-p=${n[0]}>${n[1]}<span>${n[2]}</span></button>`;
const dl=(f,t,y)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:y}));a.download=f;a.click()};
const csv=r=>r.map(x=>x.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const t=a.dataset,A=t.act;
if(A=='nav'){ui.p=t.p;render();scrollTo(0,0)}else if(A=='more')$('#sheet').classList.toggle('open');
else if(A=='add'){const b=a.closest('[data-add]'),k=b.dataset.add,o={id:uid()};b.querySelectorAll('[data-n]').forEach(i=>o[i.dataset.n]=i.type=='number'?+i.value:i.value);if(!b.querySelector('[data-n]').value)return;
if(k=='tasks')Object.assign(o,{date:td(),done:o.status=='Completed',...{cat:'Personal',pri:'Medium',time:'',desc:'',status:'Not Started'},...o});if(k=='sched')o.date=td();if(k=='goals')o.pct=o.pct||0;S[k].push(o);save();render()}
else if(A=='del'){if(!['tasks','sched'].includes(t.k)&&!confirm('Delete this?'))return;S[t.k]=S[t.k].filter(x=>x.id!=t.i);save();render()}
else if(A=='tgl'){const x=S.tasks.find(y=>y.id==t.i);x.done=!x.done;x.status=x.done?'Completed':'Not Started';save();render()}
else if(A=='hab'){const d=td(),l=S.hlog[d]||(S.hlog[d]=[]),i=l.indexOf(t.i);i<0?l.push(t.i):l.splice(i,1);save();render()}
else if(A=='tab'){ui.hz=t.v;render()}else if(A=='jd'){ui.jd=t.v;render();scrollTo(0,0)}
else if(A=='exp'){S.lastBackup=new Date().toISOString();save();dl(`my-life-os-backup-${td()}.json`,JSON.stringify(S),'application/json');render()}
else if(A=='csv'){const k=t.v;dl(k+'-'+td()+'.csv',k=='fin'?csv([['Date','Type','Category','Description','Amount'],...S.fin.map(x=>[x.date,x.type,x.cat,x.note,x.amt])]):csv([['Date','Title','Category','Priority','Time','Status'],...S.tasks.map(x=>[x.date,x.title,x.cat,x.pri,x.time,x.status])]),'text/csv')}
else if(A=='rst'){const k=$('#rs').value;if(confirm('Erase all "'+k+'" data? Export a backup first if unsure.')){S[k]=D()[k];save();render()}}});
document.addEventListener('input',e=>{const t=e.target,v=t.type=='checkbox'?t.checked:t.type=='number'||t.type=='range'?(t.value===''?'':+t.value):t.value;
if(t.dataset.o){setP(t.dataset.o,t.dataset.o=='profile.rday'?+t.value:v);save()}
else if(t.dataset.k){const x=S[t.dataset.k].find(y=>y.id==t.dataset.i);x[t.dataset.f]=v;if(t.dataset.f=='status'&&t.dataset.k=='tasks')x.done=v=='Completed';save()}});
document.addEventListener('change',e=>{const t=e.target;
if(t.id=='vf'&&t.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,500/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.vision.push({id:uid(),img:c.toDataURL('image/jpeg',.7),note:''});save();render()};im.src=r.result};r.readAsDataURL(t.files[0])}
else if(t.id=='imp'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.tasks||!o.habits)throw 0;if(confirm('Replace all current data with this backup?')){S=Object.assign(D(),o);save();render()}}catch(x){alert('This file is not a valid My Life OS backup.')}};r.readAsText(t.files[0])}
else if(t.dataset.ui=='theme'){localStorage.theme=t.value;document.documentElement.dataset.theme=t.value}
else if(t.dataset.ui){ui[t.dataset.ui]=t.value;render()}
else if(t.dataset.r!=null||t.dataset.o=='profile.rday')render()});
(async()=>{try{db=await open();S=await load();navigator.storage?.persist?.()}catch(e){}
S=Object.assign(D(),S||{});document.documentElement.dataset.theme=localStorage.theme||'auto';
$('#side').innerHTML='<h1>My Life OS</h1>'+NAV.map(nb).join('');$('#sheet').innerHTML=NAV.map(nb).join('');
$('#bn').innerHTML=[NAV[0],NAV[1],NAV[2],NAV[6]].map(nb).join('')+'<button data-act=more>☰<span>More</span></button>';
render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})})();
